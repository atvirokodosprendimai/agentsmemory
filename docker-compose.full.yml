# agentsmemory — the full-quality overlay: Qdrant for search, a cross-encoder for
# precision, and (optionally) Ollama in the stack so nothing has to be installed
# on the host first.
#
#   docker compose -f docker-compose.yml -f docker-compose.full.yml up -d
#
# ...and, if you have no Ollama on the host, add the embedder too — a third file,
# because it does not just START Ollama, it points the server at it:
#
#   docker compose -f docker-compose.yml -f docker-compose.full.yml -f docker-compose.ollama.yml up -d
#
# WHY THIS IS AN OVERLAY AND NOT THE DEFAULT
# The base file is deliberately one container: no second service to run, wait for,
# or back up. That is the right default for one person on one machine, and it
# stays the default. This file is for when recall quality matters more than
# dependency count — a palace big enough that an in-process index costs real
# memory, or a team sharing one index.
#
# SWITCHING AN EXISTING INSTALL
# SQLite is the source of truth, so nothing is re-embedded: after the first
# `up -d` with this overlay, replay the stored vectors into Qdrant once with
#
#   docker compose -f docker-compose.yml -f docker-compose.full.yml run --rm agentsmemory sync
#
# Going back is just dropping the -f docker-compose.full.yml — the chromem index
# is still on the volume, and the server refills it from SQLite if it is not.
#
# WHAT THE CROSS-ENCODER BUYS
# The embedder scores a drawer against a query it never saw; a cross-encoder reads
# the pair together. It only runs over the top RERANK_POOL candidates hybrid
# ranking already surfaced, so the cost is bounded per search rather than per
# palace. If the reranker is down, search silently falls back to the fused
# vector+BM25 ranking — it refines recall, it is never required for it.

services:
  agentsmemory:
    # depends_on is start ORDER, not readiness — but both neighbours below have
    # healthchecks, so service_healthy makes it readiness here. A cold first boot
    # therefore no longer races Qdrant (the failure was "ensure local vector
    # namespace: ... connection refused" recovered by a restart).
    depends_on:
      qdrant:
        condition: service_healthy
      reranker:
        condition: service_healthy
    environment:
      # These win over .env.docker: an overlay that needs the operator to also
      # edit an env file is an overlay that half-applies.
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      # BASE url, not the endpoint: the client appends /rerank itself. Pointing
      # this at a full path yields /v1/rerank/rerank, a 404, and a search that
      # silently falls back to the hybrid order — which is exactly how it read in
      # an eval run before the fallback started logging why.
      RERANK_URL: http://reranker:8080/v1
      # How many fused candidates the cross-encoder scores. Cost is LINEAR: it
      # scores every pair in a full forward pass. Measured on this stack
      # 2026-08-21 with drawer-sized documents: ~435ms per document, so
      # 1 doc 0.45s · 10 docs 4.1s · 25 docs 10.9s · 50 docs 21.8s.
      #
      # It said 50 until 2026-08-21, and the comment directly above it argued for
      # 20 on the grounds that 50 "overran a 30s budget ... which degrades silently
      # to the hybrid order, the worst possible way to lose a feature." The comment
      # was right and the value contradicted it. What actually happened was worse
      # than silent degradation: an MCP session's searches timed out 3 times out of
      # 3 and received NOTHING, because the client gave up long before the server's
      # own 90s budget did.
      #
      # (This block has form: it once said RERANK_TOP_K, which the server has never
      # read, so the stack advertised a pool of 20 while running the default 50.)
      #
      # What a larger pool BUYS is still unmeasured at any size. Raise it if your
      # cross-encoder is on a GPU — and keep RERANK_TIMEOUT above pool x per-doc
      # cost, or every search degrades.
      #
      # MEASURED AT THE SHIPPED DEFAULT, 2026-08-26, on an idle CPU cross-encoder:
      # 12 real recalls at pool 10 took a mean of 4.3s (min 3.3s, max 5.5s), none
      # of them past the 10s budget below. So this default fits, with about 2.3x
      # headroom on this hardware.
      #
      # Scaling to pool 20 costs 2.7x the time for 2x the documents — superlinear,
      # so a per-doc model UNDERSTATES the cost of raising the pool. That is why
      # the sentence below is wrong in shape and not only unenforced.
      #
      # That per-doc cost now has a number, and it is worse than the sentence
      # above implies. On a CPU cross-encoder, 60 traced rerank calls at pool 20
      # took a mean of 11.4s (min 7.3s, max 18.2s) — 44 of the 60 ran longer than
      # the 10s RERANK_TIMEOUT below. Pool 20 is one batch (maxBatch is 32), so
      # that is not batching overhead, it is the cost of scoring 20 documents.
      # An operator who takes the "raise it" advice on CPU therefore does not get
      # a better ranking, they get the fused order on most searches, because a
      # blown budget fails open. Nothing measured pool 10, which is what ships
      # here; do not read these numbers as a verdict on the default.
      #
      # This is observable rather than inferred: the search span carries
      # am.rerank_timeout_ms beside the rerank stage duration, and an overrun
      # ends that stage failed_open reason=timeout — distinct from reason=error,
      # which means the endpoint is unwell rather than too slow.
      RERANK_POOL: "10"
      # How much the cross-encoder decides versus the hybrid score it refines.
      # 1.0 lets it overwrite the lexical evidence entirely, which measurably
      # ranks worse; see `agentsmemory eval` and its weight sweep.
      RERANK_WEIGHT: "0.5"
      # Shorter than any client will wait, so the SERVER gives up first and returns
      # the fused order it already has. At 90s it never did: the caller died
      # holding nothing while a perfectly good page sat one fallback away.
      RERANK_TIMEOUT: "10s"
      # Traces ON by default in the deployed stack, printed as a compact stage
      # tree to stderr. This is not observability for its own sake: an ADR audit
      # on 2026-08-25 found records claiming pending work that had shipped, and
      # one whose two remaining tasks measure a knob the served path never reads
      # under the shipped fusion. A span saying `bypassed reason=scale_zero`
      # settles in one line what a document argued about for weeks.
      #
      # It costs nothing that matters: telemetry never changes ranking, and a
      # collector that is down drops observability rather than results. The value
      # is an OTLP HTTP endpoint when you have a collector; `stdout` needs none.
      # scripts/redeploy.sh FAILS the deploy when the smoke search leaves no
      # span, so this cannot quietly stop working.
      AGENTSMEMORY_OTEL_ENDPOINT: "stdout"

  qdrant:
    image: qdrant/qdrant:v1.15.0
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      # Loopback only: this port is unauthenticated unless you set a Qdrant API
      # key. Drop the mapping entirely if you do not want the dashboard at
      # http://localhost:6333/dashboard — the server reaches Qdrant over the
      # compose network either way.
      - "127.0.0.1:6333:6333"
    healthcheck:
      # Qdrant's image has no curl or wget, but it does have bash — so /dev/tcp
      # is the portable probe here. It answers as soon as the HTTP port accepts,
      # which is exactly the readiness the server needs.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  reranker:
    # llama.cpp's server, chosen because this is the CONTAINERISED path and it
    # ships native arm64 and amd64 images, serving a Cohere-shaped /v1/rerank.
    #
    # text-embeddings-inference is the reference server and the same client
    # speaks it (see internal/rerank). The constraint is narrower than it first
    # looks: TEI's Docker images are amd64-only, so IN COMPOSE on Apple Silicon it
    # would run emulated — but TEI itself runs natively there, either
    # `brew install text-embeddings-inference` or `cargo install --path router -F
    # metal`, and with Metal it is the faster option by a distance.
    #
    # So: point RERANK_URL at TEI whenever you have one — a GPU box, a Linux
    # server, or a local Metal build — and keep this service for the case it
    # exists to serve, which is "one machine, no GPU, nothing installed".
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command:
      # Q4_K_M keeps a 568M-parameter cross-encoder around 360MB of RAM and
      # answers a 50-candidate rerank in well under a second on CPU. The model is
      # fetched once into the volume below, not baked into the image.
      - "-hf"
      - "gpustack/bge-reranker-v2-m3-GGUF:Q4_K_M"
      - "--reranking"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      # A drawer is at most ~1600 characters (see palace.ChunkSize) and the query
      # is capped at 250, so 2048 tokens of context is enough for a query/drawer
      # pair with room to spare.
      - "-c"
      - "2048"
      # ...but context is not the binding constraint: a cross-encoder scores the
      # pair in ONE forward pass, so the whole pair must fit in a single physical
      # batch. llama.cpp defaults that to 512 and answers a real drawer with
      # `input (538 tokens) is too large to process. increase the physical batch
      # size`, which the server then degrades to the hybrid order. Both batch
      # sizes therefore match the context window.
      - "-b"
      - "2048"
      - "-ub"
      - "2048"
    volumes:
      - reranker-models:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      # Generous: the first start downloads the model. Later starts hit the cache
      # and pass on the first probe.
      retries: 60
      start_period: 30s

volumes:
  qdrant-data:
  reranker-models:
