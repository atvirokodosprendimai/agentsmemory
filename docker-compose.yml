# agentsmemory — self-hosted, one person, one machine.
#
# ONE service. The server runs in --local mode (one workspace, no token, no
# dashboard) and indexes search with chromem, an embedded vector database that
# lives inside this process and stores its files in the volume below — so there
# is no second container to run, wait for, or back up separately.
#
# Ollama is deliberately NOT a service either: most people already run it on the
# host or point at a shared box, and a second copy would re-download several GB
# of models. See .env.docker.example for both cases — and pull the embedding
# model first (`ollama pull bge-m3`), or every write fails at the embed step.
#
#   cp .env.docker.example .env.docker
#   docker compose up -d
#   aiagentmemory install --local --agent all    # claude | codex | cursor | pi
#
# That last line is the whole wiring, not just the MCP. Registering the server by
# hand (`claude mcp add --transport http agentsmemory http://localhost:8080/mcp`)
# gives an agent the tools and nothing else — no memory protocol, no hooks, no
# subagent definition — so the tools are available and never called. This comment
# said exactly that and then printed the half-command anyway.

name: agentsmemory

services:
  agentsmemory:
    # ⚠ VERSION IS PASSED SO A RUNNING CONTAINER CAN NAME THE COMMIT IT WAS BUILT
    # FROM. The Dockerfile already declares `ARG VERSION=dev` and stamps it into
    # main.version; compose said only `build: .`, so every locally built image
    # reported `agentsmemory version dev` while the host binaries beside it
    # reported their real revision. That is not cosmetic: on 2026-08-30 the only
    # way to tell whether the container held a fix was to run the fix and see,
    # because the version it printed was the same string before and after.
    #
    # It defaults to `dev`, so a bare `docker compose build` behaves exactly as
    # before. To stamp it, pass the revision:
    #
    #   AGENTSMEMORY_VERSION=$(git rev-parse --short HEAD) docker compose build agentsmemory
    build:
      context: .
      args:
        VERSION: ${AGENTSMEMORY_VERSION:-dev}
    image: agentsmemory:local
    restart: unless-stopped
    env_file: .env.docker
    # --addr :8080 binds every interface INSIDE the container, which is required
    # for a published port to reach it — the loopback default local mode uses on
    # a host would make the container unreachable. The boundary here is the ports
    # entry below, which publishes to the host's loopback only, and the process is
    # told so by the environment block underneath. (Setting AGENTSMEMORY_LOCAL_TOKEN
    # in .env.docker adds a line confirming the token gate.)
    command: ["serve", "--local", "--addr", ":8080", "--db", "/data/agentsmemory.db"]
    environment:
      # The ports entry below IS the boundary, and the process cannot see it from
      # inside the container. Saying so here turns the boot-time exposure warning
      # into one accurate line — a warning that fires on every boot of the default
      # path is a warning operators learn to ignore. Remove this if you ever widen
      # the publish beyond 127.0.0.1, so the real warning comes back.
      AGENTSMEMORY_PUBLISHED_LOOPBACK: "1"
    ports:
      # 127.0.0.1: is load-bearing. /mcp is UNAUTHENTICATED in local mode, so
      # publishing as "8080:8080" would hand every device on your network full
      # read and write access to your memory. Override the host port (not the
      # interface) with AGENTSMEMORY_HOST_PORT — Compose reads that one from your
      # shell or a .env file beside this one, NOT from .env.docker, which is
      # passed to the container rather than interpolated here.
      #
      # To serve other machines deliberately, set AGENTSMEMORY_LOCAL_TOKEN in
      # .env.docker FIRST (the server picks it up with no change to command:
      # above), and only then widen this to "8080:8080". The token is what makes
      # the wider publish safe; without it, widening is the mistake this comment
      # exists to prevent.
      - "127.0.0.1:${AGENTSMEMORY_HOST_PORT:-8080}:8080"
    volumes:
      # Holds both halves: /data/agentsmemory.db (the SQLite source of truth,
      # everything you remember) and /data/agentsmemory.chromem (the search
      # index, derived from it — the server refills it from SQLite on boot if it
      # is ever missing). One volume to back up, not two.
      - agentsmemory-data:/data
    extra_hosts:
      # Linux has no host.docker.internal; this maps it to the host gateway so
      # one OLLAMA_URL works on Linux, macOS and Windows alike. Harmless where
      # Docker Desktop already provides the name.
      - "host.docker.internal:host-gateway"

  # Want Qdrant, and a cross-encoder in front of the results? That is the right
  # call once the palace is large enough that an in-process index costs real
  # memory, when several machines share one index, or when recall precision is
  # worth a couple of extra containers. It ships as an overlay rather than a
  # commented-out block here, so it is one flag and not a diff:
  #
  #   docker compose -f docker-compose.yml -f docker-compose.full.yml up -d
  #
  # Switching is safe in both directions: SQLite is the source of truth, so
  # `docker compose ... run --rm agentsmemory sync` replays the stored vectors
  # into Qdrant without re-embedding, and dropping the overlay falls back to the
  # chromem index still sitting on the volume.

volumes:
  agentsmemory-data:
