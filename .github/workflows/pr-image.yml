name: pr-image

# Publish a disposable image for the exact head of a pull request without
# touching release tags or `latest`. Same-repository PRs build automatically;
# a maintainer can explicitly build any PR (including a fork PR) by dispatching
# this workflow with its number and reviewed head SHA.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose reviewed head should be built
        required: true
        type: string
      head_sha:
        description: Reviewed 40-character head SHA; the build fails if the PR moved
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr-image-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  image:
    # Fork PRs do not receive a package-writing token. A maintainer can still
    # opt in through workflow_dispatch, which is an explicit trust decision.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve pull request source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pr_number="$EVENT_PR_NUMBER"
            ref="$EVENT_HEAD_SHA"
            expected_sha="$EVENT_HEAD_SHA"
          else
            pr_number="$INPUT_PR_NUMBER"
            if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
              echo "pr_number must be a positive integer" >&2
              exit 1
            fi
            ref="refs/pull/${pr_number}/head"
            expected_sha="${INPUT_HEAD_SHA,,}"
            if [[ ! "$expected_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "head_sha must be the reviewed 40-character PR head SHA" >&2
              exit 1
            fi
          fi
          {
            echo "pr_number=$pr_number"
            echo "ref=$ref"
            echo "expected_sha=$expected_sha"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record immutable source identity
        id: identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.expected_sha }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_SHA" ] && [ "$source_sha" != "$EXPECTED_SHA" ]; then
            echo "checked out $source_sha, expected PR head $EXPECTED_SHA" >&2
            exit 1
          fi
          # Preview versions live in a separate package, so their seven-day
          # cleanup has no API path to the release package that owns `latest`.
          image="ghcr.io/${GITHUB_REPOSITORY,,}-pr"
          {
            echo "source_sha=$source_sha"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A published preview must imply a green tree rather than racing the
      # separate build workflow and becoming deployable before its tests fail.
      - name: Test
        run: go test ./...

      # The runtime stage installs packages, so its layer EXECUTES on the target
      # architecture; without QEMU the arm64 build dies with "exec format error".
      # Only that small apk layer is emulated — the Go build is cross-compiled by
      # the $BUILDPLATFORM-pinned builder stage (see Dockerfile).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by canonical digest first. No tag exists at this point, so this
      # step cannot move `latest`, a version tag, or a previous PR tag.
      - name: Build and push canonical image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # A preview exists to be deployed somewhere before it is merged, and
          # this team's own host is arm64 — an amd64-only preview cannot be run
          # on the machine the summary below tells you to run it on. Building
          # both keeps the "deploy the immutable digest" instructions true.
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.identity.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ steps.identity.outputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=agentsmemory PR ${{ steps.source.outputs.pr_number }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The readable tag includes both the PR number and the complete container
      # digest. A different rebuild necessarily gets a different tag. Preserve
      # the source manifest format so the tag resolves to the digest in its name.
      #
      # Now that the build is multi-platform that source digest is an INDEX
      # digest rather than a single manifest's, which is why --prefer-index=false
      # still earns its place: the flag only forces the single-manifest case not
      # to be wrapped, so an index source is copied unchanged and the equality
      # asserted below holds for either shape. If that ever stops being true the
      # `test` fails loudly here rather than publishing a tag pointing elsewhere.
      - name: Add digest-derived PR tag
        id: publish
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.identity.outputs.image }}
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
        run: |
          digest="$DIGEST"
          image="$IMAGE"
          pr_number="$PR_NUMBER"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "build returned invalid digest: $digest" >&2
            exit 1
          fi
          tag="pr-${pr_number}-sha256-${digest#sha256:}"
          docker buildx imagetools create --prefer-index=false \
            --tag "${image}:${tag}" "${image}@${digest}"
          tag_digest="$(docker buildx imagetools inspect "${image}:${tag}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          test "$tag_digest" = "$digest"
          canonical="${image}@${digest}"
          {
            echo "tag=$tag"
            echo "tagged=${image}:${tag}"
            echo "canonical=$canonical"
          } >> "$GITHUB_OUTPUT"

      - name: Publish deployment instructions
        shell: bash
        env:
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          TAGGED: ${{ steps.publish.outputs.tagged }}
          CANONICAL: ${{ steps.publish.outputs.canonical }}
        run: |
          {
            echo "## PR ${PR_NUMBER} test image"
            echo
            echo "Source commit: \`${SOURCE_SHA}\`"
            echo "Readable tag: \`${TAGGED}\`"
            echo "Canonical digest: \`${CANONICAL}\`"
            echo
            echo "Deploy the immutable digest with:"
            echo '```bash'
            echo "AGENTSMEMORY_IMAGE='${CANONICAL}' docker compose -f docker-compose.prod.yml up -d"
            echo '```'
            echo
            echo "The release tags and \`latest\` were not changed. PR images are eligible for cleanup after seven days."
          } >> "$GITHUB_STEP_SUMMARY"
