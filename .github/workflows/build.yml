name: build

# Server binaries, gated on version tags. Every push to main and every PR runs
# the test job (vet + full suite) so branches and PRs stay protected, but the
# cross-compile and GitHub Release upload run ONLY on a strict semantic-version
# tag like v1.2.3 — never on a branch push, a PR, or a loose tag such as v1,
# v1.2, or a pre-release like v1.2.3-rc1.
#
# The push trigger's 'v*.*.*' glob already needs two dots, but a glob cannot
# assert "digits only / exactly three parts" (GitHub Actions has no regex here),
# so the `check` job does the strict match and gates the build/release jobs —
# mirroring the sibling release.yml, which owns the container image off the same
# tag. The two workflows run independently.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

# Least privilege by default: the test and build jobs only read the repo. Only
# the release job (which creates/updates a Release and uploads assets) escalates
# to contents:write, and it does so at job scope.
permissions:
  contents: read

jobs:
  # Strict version-tag gate. Emits release=true only for a full vX.Y.Z tag on a
  # tag ref, so the build + release jobs skip branch pushes, PRs, and loose tags
  # (v1, v1.2, v1.2.3-rc1). The refs/tags guard matters here because this
  # workflow — unlike release.yml — also triggers on branches, so a branch that
  # happened to be named "v1.2.3" must not be mistaken for a release.
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.semver.outputs.release }}
    steps:
      - id: semver
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Building release for $tag"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=skipped::$tag is not a strict vX.X.X tag; skipping binary build."
          fi

  # Gate every binary on a green tree: vet + the full test suite. Runs on every
  # push and PR (this is the CI safety net for branches), independent of the tag
  # gate above — the build job depends on both.
  #
  # The race detector is NOT here; it is the `race` job below, running beside
  # this one rather than after it. Both are required contexts, so "green" still
  # means both — splitting changed the wall clock, not the bar.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Go's build cache, rolled forward per commit.
      #
      # setup-go caches too, and its cache is the reason this is needed rather
      # than redundant: its key is the go.sum hash alone, so on a repo whose
      # dependencies rarely move the key always HITS — and on a hit the action
      # logs "not saving cache" and writes nothing back. The 373MB it restores is
      # frozen at whatever existed the first time that go.sum appeared, so no
      # compiled object or test result from any recent commit is ever in it.
      # Measured on the run for da6b388: "(cached)" appears ZERO times across all
      # 41 packages, in both jobs.
      #
      # A commit-keyed key with a prefix restore-key rolls instead: every run
      # restores the most recent cache and saves its own, so the next run starts
      # from the previous commit's objects and Go can reuse the test RESULTS of
      # every package the commit did not touch. Measured locally: an identical
      # tree is 41/41 cached (1.6s for the suite), and touching one file in
      # internal/palace leaves 32/41 cached, re-running only that package, its
      # dependents, and the gates that read the whole tree — which is exactly
      # what should be re-run.
      #
      # The two jobs key separately (test). -race objects are a different build
      # configuration from plain ones, and a shared key would have each job's save
      # overwrite the other's with a cache that is half-useless to both.
      #
      # ⚠ `go test -count=1` DISABLES result reuse, silently and completely. If a
      # future step adds it for a "clean" run, this cache keeps being uploaded and
      # downloaded while buying nothing — the cost with none of the benefit, and
      # no signal that it happened.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            go-build-test-${{ runner.os }}-
      # A malformed workflow does not run and therefore cannot report its own
      # failure. Lint every workflow from this independent, always-on CI path.
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Vet
        run: go vet ./...
      # The output goes to a file and the exit code is captured BEFORE anything
      # else runs: piping `go test` into tee/grep makes the pipeline's status the
      # last command's, which is how a red suite reports green. The cached count
      # is the only signal that the build cache above is doing anything — without
      # it a cache that silently stopped rolling forward looks exactly like one
      # that works, while still paying the upload every run.
      - name: Test
        run: |
          go test ./... > test.log 2>&1; code=$?
          cat test.log
          echo "::notice title=cache::$(grep -c '(cached)' test.log) of $(grep -cE '^(ok|FAIL)' test.log) packages served from cache"
          exit $code
      - name: Contract-axis
        run: go test -tags contractaxis ./internal/mcptest

  # The race detector, on its own job so it runs BESIDE vet/test rather than
  # after them. It is 384s of a 565s job measured across three consecutive runs
  # (2026-08-30) — 65% of the wall clock, and every second of it was serialised
  # behind work that does not depend on it. Splitting costs one extra runner and
  # one extra checkout+setup (~17s) and returns ~165s.
  #
  # ⚠ It is a REQUIRED context in branch protection, and it has to stay one. A
  # gate moved off the blocking path is this repository's signature defect in its
  # CI form: the job still runs, still goes red, and stops preventing anything.
  # The whole point of the step's own history — nothing here ran -race until it
  # was added — is that an unenforced check is the same as an absent one.
  #
  # Two packages are 54% of this job (internal/palace 130.0s, cmd/server 93.3s
  # under -race locally), and nothing in the tree calls t.Parallel(), so the
  # floor is the slowest single package however many cores the runner has.
  # nproc is printed rather than assumed: sharding this job is only worth doing
  # against a measured core count, and the figure belongs in the log where the
  # next person can read it instead of in a comment that goes stale.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Go's build cache, rolled forward per commit.
      #
      # setup-go caches too, and its cache is the reason this is needed rather
      # than redundant: its key is the go.sum hash alone, so on a repo whose
      # dependencies rarely move the key always HITS — and on a hit the action
      # logs "not saving cache" and writes nothing back. The 373MB it restores is
      # frozen at whatever existed the first time that go.sum appeared, so no
      # compiled object or test result from any recent commit is ever in it.
      # Measured on the run for da6b388: "(cached)" appears ZERO times across all
      # 41 packages, in both jobs.
      #
      # A commit-keyed key with a prefix restore-key rolls instead: every run
      # restores the most recent cache and saves its own, so the next run starts
      # from the previous commit's objects and Go can reuse the test RESULTS of
      # every package the commit did not touch. Measured locally: an identical
      # tree is 41/41 cached (1.6s for the suite), and touching one file in
      # internal/palace leaves 32/41 cached, re-running only that package, its
      # dependents, and the gates that read the whole tree — which is exactly
      # what should be re-run.
      #
      # The two jobs key separately (race). -race objects are a different build
      # configuration from plain ones, and a shared key would have each job's save
      # overwrite the other's with a cache that is half-useless to both.
      #
      # ⚠ `go test -count=1` DISABLES result reuse, silently and completely. If a
      # future step adds it for a "clean" run, this cache keeps being uploaded and
      # downloaded while buying nothing — the cost with none of the benefit, and
      # no signal that it happened.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-race-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            go-build-race-${{ runner.os }}-
      - name: Runner capacity
        run: 'echo "vCPU: $(nproc)"; echo "GOMAXPROCS default: $(go env GOMAXPROCS)"'
      # Nothing in this repo ran the race detector until now — not CI, not an
      # ADR fence, not a Makefile — so a change that introduced a goroutine had
      # no path that would ever have asked. The suite was already race-clean
      # when measured, which makes this an ENFORCEMENT gap rather than a bug
      # fix: the point is that the next unsynchronised access fails here instead
      # of in production. Kept as its own step rather than a flag on the run
      # above so a red build says which of the two failed, and because -race
      # needs cgo while several other paths deliberately build with CGO_ENABLED=0.
      #
      # -timeout is not decoration and must not be dropped back to the default.
      # go test allows 10 minutes PER PACKAGE, and instrumentation blows through
      # it: internal/palace measures 15.7s plain and 108.8s under -race locally
      # (6.9x), and the runner is slower again, so the first CI run of this step
      # died at exactly 600s with "test timed out" — no data race anywhere in the
      # log, and the test it interrupted had been going four seconds. A timeout
      # exists to catch a HANG, not to bound a legitimately slow instrumented
      # suite, so it is raised rather than the suite trimmed.
      - name: Race
        run: |
          go test -race -timeout=30m ./... > race.log 2>&1; code=$?
          cat race.log
          echo "::notice title=cache::$(grep -c '(cached)' race.log) of $(grep -cE '^(ok|FAIL)' race.log) packages served from cache"
          exit $code

  # Cross-compile the static binary for each target. CGO is off (pure-Go SQLite
  # via modernc), so every GOOS/GOARCH builds on the linux runner with no C
  # cross-toolchain. fail-fast: false so one bad target does not cancel the rest.
  # Tag-only: needs a passing `test` AND `race`, plus a `check` verdict of
  # release=true, so cross-compiles run on strict version tags, not on every
  # push/PR. race is in `needs` because a binary must not ship on a tree the
  # race detector rejects — the split moved that check, it did not relax it.
  build:
    needs: [test, race, check]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # -trimpath strips local filesystem paths for reproducible builds; -s -w
      # drop the symbol table and DWARF for a smaller binary. The committed
      # *_templ.go are built as-is, so no templ generation step is needed.
      - name: Build
        run: |
          bin=agentsmemory
          [ "${{ matrix.goos }}" = windows ] && bin=agentsmemory.exe
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o "$bin" ./cmd/server

      # Conventional archives: tar.gz for unix, zip for windows. The archive name
      # is version-free — the Actions run (or the release tag) supplies the
      # version, and a branch ref name could contain a slash that is unsafe in a
      # filename. The release job derives a versioned asset set from the tag.
      - name: Archive
        id: archive
        run: |
          name="agentsmemory_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = windows ]; then
            zip "$name.zip" agentsmemory.exe
            echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" agentsmemory
            echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      # On a tag build, each target's archive is uploaded as a run artifact (kept
      # 14 days) so the release job below can re-gather every target into one
      # dist/ folder. Because the whole build job is tag-gated, these artifacts
      # exist only for version tags, not for ordinary pushes/PRs.
      - uses: actions/upload-artifact@v4
        with:
          name: agentsmemory_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ steps.archive.outputs.file }}
          retention-days: 14

  # Strict-tag-only: gather every matrix archive, checksum them, and attach them
  # to the GitHub Release. A single dedicated job owns the Release so concurrent
  # matrix jobs never race to create-or-update it. It inherits the `check` gate
  # transitively through `build`, but asserts it explicitly too so the intent is
  # local to the job.
  release:
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the Release and upload assets
    steps:
      # merge-multiple flattens all per-target artifacts into one dist/ folder.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file over every archive so downloaders can verify integrity.
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt

      # softprops creates the Release if the tag has none yet (a pushed tag does
      # not auto-create one) and uploads the assets. The `check` gate only admits
      # strict vX.Y.Z tags, so a pre-release like v1.2.3-rc1 never reaches this
      # job — no prerelease flag is needed. fail_on_unmatched_files guards against
      # a silently empty upload if the globs ever stop matching.
      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
