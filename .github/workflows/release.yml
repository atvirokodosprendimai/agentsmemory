name: release

# Build and publish the container image ONLY on a full semantic-version tag like
# v1.2.3 — never on v1, v1.2, or pre-release tags such as v1.2.3-rc1.
#
# The tag filter below is a GLOB (GitHub Actions does not support regex here).
# "v*.*.*" already excludes v1 and v1.2 because it requires two dots, but a glob
# cannot assert "digits only / exactly three parts" — so the `check` job does the
# strict regex match and gates the build accordingly.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # write: upload the CLI and server binaries as release assets
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.semver.outputs.release }}
    steps:
      - id: semver
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Building release for $tag"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=skipped::$tag is not a strict vX.X.X tag; skipping build."
          fi

  image:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Release builds must pass tests.
      - name: Test
        run: go test ./...

      # The race detector is a separate step, not a flag on the run above: the
      # two answer different questions, and keeping them apart means a red build
      # says which one failed. This workflow carries its own gate rather than
      # leaning on build.yml because the two run independently by design — a tag
      # publishes from here whatever the sibling workflow is doing.
      # -timeout for the same reason as build.yml: the default is 10 minutes PER
      # PACKAGE and the instrumented suite exceeds it on a CI runner.
      - name: Race
        run: go test -race -timeout=30m ./...

      # The runtime stage installs packages, so its layer EXECUTES on the target
      # architecture; without QEMU the arm64 build dies with "exec format error".
      # Only that small apk layer is emulated — the Go build is cross-compiled by
      # the $BUILDPLATFORM-pinned builder stage (see Dockerfile).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags from the git tag: the exact version plus "latest".
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      # linux/arm64 alongside amd64: an arm64 host (Apple Silicon, Graviton, a
      # Pi) could not pull a released image at all before this — `docker pull`
      # failed with "no matching manifest", so the only route was building from
      # source. Publishing both makes the manifest an index and costs nothing
      # extra in GHCR. The runtime dependencies of the compose shapes are all
      # multi-arch already, so the image was the sole blocker.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Cross-compile the two raw, un-archived binaries and attach them to the
  # GitHub Release under a predictable `<name>-<goos>-<goarch>` asset name, so a
  # plain curl (or the curl|bash install.sh) can fetch the right one for the
  # user's OS/arch without unpacking an archive first:
  #
  #   aiagentmemory-<goos>-<goarch>         the installer/CLI (./clients/claude-code)
  #   aiagentmemory-server-<goos>-<goarch>  the server itself  (./cmd/server)
  #
  # The server also ships as a versioned tar.gz/zip from the sibling build.yml
  # (which additionally covers windows/amd64 and emits SHA256SUMS.txt); this job
  # deliberately duplicates it as a raw binary because README's `--local`
  # quickstart tells the reader to run `./agentsmemory` directly, and a raw asset
  # is what makes that a one-line download.
  #
  # Neither package needs cgo — SQLite is pure Go via modernc — so a static
  # CGO_ENABLED=0 build cross-compiles every target on the one linux runner.
  binaries:
    # Depend on `image` (not just `check`) so the release binaries publish only
    # after that job's `go test ./...` passes — untested binaries must not ship.
    needs: [check, image]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build aiagentmemory CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="aiagentmemory-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$out" ./clients/claude-code
          echo "cli_asset=$out" >>"$GITHUB_ENV"

      # The server now carries a main.version symbol (cmd/server/version.go),
      # so the release stamp lands the same way it does for the CLI above.
      # cmd/server/version_test.go goes red if the flag or the wiring is
      # removed — the old comment here documented a stamp the linker would
      # silently discard, and that failure mode is now a failing test.
      - name: Build agentsmemory server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="aiagentmemory-server-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$out" ./cmd/server
          echo "server_asset=$out" >>"$GITHUB_ENV"

      # fail_on_unmatched_files turns a vanished asset into a red release rather
      # than a quietly incomplete one — the failure mode that matters now that
      # install.sh and the README both point at fixed asset names.
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ env.cli_asset }}
            ${{ env.server_asset }}
