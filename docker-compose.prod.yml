# agentsmemory — hosted (multi-tenant) deployment, the shape behind
# aiagentmemory.dev: the full server with dashboard, auth and billing, as one
# container from the released GHCR image. This is NOT the self-hosted --local
# stack (that is docker-compose.yml); here the image runs its default `serve`
# command — multi-workspace, dashboard, no --local.
#
#   cp .env.example .env.prod      # session key, OAuth, billing — all required
#   docker compose -f docker-compose.prod.yml up -d
#
# Put this behind a TLS reverse proxy (Caddy, nginx, Traefik): the port is
# published on the host loopback only, and the proxy terminates https:// and
# forwards to 127.0.0.1:8080. Billing is single-provider per deployment: set
# BILLING_PROVIDER and that provider's variables in .env.prod (the .env.example
# Billing block documents the OpenCollective contribution-checkout URLs, and the
# OPENCOLLECTIVE_PERSONAL_TOKEN / _COLLECTIVE_SLUG pair that turns automatic plan
# activation on — without them a paid contribution needs `set-plan`). The whole
# file is passed through by env_file below, so no per-variable list needs updating
# here when a knob is added.
#
# AGENTSMEMORY_IMAGE accepts a complete image reference, including an immutable
# ghcr.io/...@sha256:... PR preview. When it is empty, AGENTSMEMORY_IMAGE_TAG
# pins the released image tag (default: latest). The CI deploy workflow
# (.github/workflows/deploy.yml) sets the latter to the released tag — e.g.
# 0.0.75 for git tag v0.0.75 — so a normal rollout runs the exact release.

name: agentsmemory-hosted

services:
  agentsmemory:
    image: ${AGENTSMEMORY_IMAGE:-ghcr.io/atvirokodosprendimai/agentsmemory:${AGENTSMEMORY_IMAGE_TAG:-latest}}
    restart: unless-stopped
    env_file: .env.prod
    ports:
      # Loopback-only on purpose: TLS and routing belong to the reverse proxy in
      # front of this stack, so nothing here is exposed to the LAN.
      - "127.0.0.1:8080:8080"
    volumes:
      - agentsmemory-hosted-data:/data

volumes:
  agentsmemory-hosted-data:
